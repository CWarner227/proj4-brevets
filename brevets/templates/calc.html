<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACP Controle Times</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/calc.css') }}">
  <script src="{{ url_for('static', filename='js/moment.min.js') }}"></script>
</head>
<body>
<main>
  <h1>ACP Brevet Times</h1>
  <p>Select a brevet distance and start time, then enter control distances in either unit.</p>
  <p>Times use your browser's local time zone at the selected start. All controls use that same offset.</p>

  <form>
    <div class="settings">
      <label for="brevet_dist_km">Brevet distance</label>
      <select name="distance" id="brevet_dist_km">
        {% for distance in [200, 300, 400, 600, 1000] %}
        <option value="{{ distance }}">{{ distance }} km</option>
        {% endfor %}
      </select>
      <label for="begin_date">Start date</label>
      <input type="date" name="begin_date" id="begin_date" required>
      <label for="begin_time">Start time</label>
      <input type="time" name="begin_time" id="begin_time" value="00:00" required>
    </div>

    <div class="table-scroll">
      <table class="control_time_table">
        <thead>
          <tr>
            <th scope="col">Miles</th>
            <th scope="col">Km</th>
            <th scope="col">Location</th>
            <th scope="col">Open</th>
            <th scope="col">Close</th>
            <th scope="col">Notes</th>
          </tr>
        </thead>
        <tbody>
          {% for row in range(20) %}
          <tr class="control">
            <td><input name="miles" type="number" min="0" step="any" aria-label="Control {{ row + 1 }} miles"></td>
            <td><input name="km" type="number" min="0" step="any" aria-label="Control {{ row + 1 }} kilometers"></td>
            <td><input name="location" type="text" placeholder="Optional location" aria-label="Control {{ row + 1 }} location"></td>
            <td><input name="open" type="text" readonly aria-label="Control {{ row + 1 }} opening time"></td>
            <td><input name="close" type="text" readonly aria-label="Control {{ row + 1 }} closing time"></td>
            <td class="notes" aria-live="polite"></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </form>
</main>

<script>
  const timeCalcUrl = {{ url_for('_calc_times')|tojson }};
  const dateField = document.getElementById("begin_date");
  const timeField = document.getElementById("begin_time");
  const brevetField = document.getElementById("brevet_dist_km");
  const controls = document.querySelectorAll(".control");
  let requestNumber = 0;

  dateField.value = moment().format("YYYY-MM-DD");

  async function calcTimes(control) {
    const requestId = String(++requestNumber);
    control.dataset.requestId = requestId;
    const km = control.querySelector('[name="km"]');
    const opening = control.querySelector('[name="open"]');
    const closing = control.querySelector('[name="close"]');
    const notes = control.querySelector(".notes");
    opening.value = "";
    closing.value = "";
    notes.textContent = "";

    if (km.validity.badInput || (km.value !== "" && !km.validity.valid)) {
      notes.textContent = "Enter a nonnegative distance.";
      return;
    }
    if (km.value === "") return;
    if (!dateField.validity.valid || !timeField.validity.valid) {
      notes.textContent = "Enter a valid start date and time.";
      return;
    }

    const start = moment(dateField.value + "T" + timeField.value,
                         "YYYY-MM-DDTHH:mm", true);
    if (!start.isValid()) {
      notes.textContent = "Enter a valid start date and time.";
      return;
    }
    const query = new URLSearchParams({
      km: km.value, brevet: brevetField.value, start: start.format()
    });

    try {
      const response = await fetch(timeCalcUrl + "?" + query);
      const data = await response.json();
      if (control.dataset.requestId !== requestId) return;
      if (!response.ok) throw new Error(data.error || "Unable to calculate times.");
      opening.value = moment.parseZone(data.result.open).format("YYYY-MM-DD HH:mm");
      closing.value = moment.parseZone(data.result.close).format("YYYY-MM-DD HH:mm");
    } catch (error) {
      if (control.dataset.requestId === requestId) {
        notes.textContent = "Unable to calculate times. Check your entries and try again.";
      }
    }
  }

  function updateDistance(event) {
    const source = event.target;
    const control = source.closest(".control");
    const isMiles = source.name === "miles";
    const target = control.querySelector(isMiles ? '[name="km"]' : '[name="miles"]');
    if (source.value === "" || !source.validity.valid) {
      target.value = "";
    } else {
      const distance = Number(source.value);
      target.value = isMiles ? Math.floor(distance * 1.609344) : (distance / 1.609344).toFixed(1);
    }
    calcTimes(control);
    if (source.validity.badInput || (source.value !== "" && !source.validity.valid)) {
      control.querySelector(".notes").textContent = "Enter a nonnegative distance.";
    }
  }

  document.querySelectorAll('[name="km"], [name="miles"]').forEach(function (field) {
    field.addEventListener("input", updateDistance);
  });
  [dateField, timeField, brevetField].forEach(function (field) {
    field.addEventListener("change", function () {
      controls.forEach(calcTimes);
    });
  });
  document.querySelector("form").addEventListener("submit", function (event) {
    event.preventDefault();
  });
</script>
</body>
</html>
